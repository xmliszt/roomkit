[project]
name = "interior-planner-python"
version = "0.0.0"
description = "Python workers and spikes for Interior Planner"
requires-python = "==3.13.*"
dependencies = [
    "mlx>=0.32.4",
    "mlx-spatial==0.0.3",
    "mlx-vlm==0.8.0",
    "numpy>=2.5.5",
    "opencv-contrib-python>=5.1.0.95",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
    "scipy>=1.18.1",
    "huggingface-hub>=2.4.0",
    "trimesh>=5.2.2",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
package = false
override-dependencies = ["opencv-python; sys_platform == 'never'"]
