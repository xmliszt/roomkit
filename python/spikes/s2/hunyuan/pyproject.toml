    "torchdiffeq>=0.2.4",
    "timm>=1.0.0",
    "Pillow>=10.4.0",
    "opencv-python>=4.10.0",
    "imageio>=2.35.0",
    "scikit-image>=0.24.0",
    "spandrel>=0.4.2,<0.5",
    "trimesh>=4.4.0",
    "numpy>=1.26,<2.2",
