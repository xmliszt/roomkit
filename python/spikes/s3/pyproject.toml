[project]
name = "interior-planner-spike-s3"
version = "0.0.0"
description = "Spike S3: segmentation from a box prompt"
requires-python = "==3.13.*"
dependencies = [
    "huggingface-hub>=2.4.0",
    "mlx-vlm==0.8.0",
    "numpy>=2.5.5",
    "opencv-contrib-python>=5.1.0.95",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
]

[tool.uv]
package = false
override-dependencies = ["opencv-python; sys_platform == 'never'"]
